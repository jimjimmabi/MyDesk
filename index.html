<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>마이데스크 • 도토리숲 도구들</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Gaegu:wght@400;700&family=Nanum+Gothic:wght@400;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg: #F5F5F5;
            --panel: #FFFFFF;
            --border: #CCCCCC;
            --border-dark: #999999;
            --pink: #FF9EC4;
            --pink-dark: #E87BA8;
            --blue: #A8D8FF;
            --blue-dark: #6FB8E8;
            --text: #333333;
            --text-light: #888888;
            --link: #0066CC;
            --acorn: #C68B4A;
            --acorn-dark: #8B5E2E;
            --cream: #FFF8F0;
            --cream-dark: #F0E4D4;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Nanum Gothic', 'Dotum', sans-serif;
            background: linear-gradient(to bottom, #EAF6FF 0%, #F5F5F5 200px);
            min-height: 100vh;
            color: var(--text);
            line-height: 1.6;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 12px;
        }

        .container { width: 100%; max-width: 1200px; }

        .app-header {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 12px 18px;
            margin-bottom: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            position: relative;
            overflow: hidden;
        }
        .app-header::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 4px;
            background: repeating-linear-gradient(135deg, var(--pink) 0 10px, var(--cream) 10px 20px, var(--blue) 20px 30px, var(--cream) 30px 40px);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: 'Gaegu', cursive;
            font-size: 22px;
            font-weight: bold;
            color: var(--acorn-dark);
        }
        .brand i { color: var(--pink-dark); }

        .header-right {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .status-chip {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 12px;
            background: var(--cream);
            border: 1px solid var(--cream-dark);
            border-radius: 999px;
            font-size: 11px;
            font-weight: bold;
            color: var(--acorn-dark);
        }
        .status-chip i { color: #4CAF50; }

        .lang-selector {
            display: flex;
            gap: 2px;
            background: var(--cream);
            border: 1px solid var(--cream-dark);
            border-radius: 4px;
            padding: 2px;
        }
        .lang-btn {
            padding: 4px 10px;
            font-size: 11px;
            font-weight: bold;
            border-radius: 3px;
            border: 1px solid transparent;
            background: transparent;
            color: var(--text-light);
            cursor: pointer;
            transition: all 0.15s;
        }
        .lang-btn:hover { background: #fff; color: var(--acorn-dark); }
        .lang-btn.active {
            background: linear-gradient(to bottom, #FFB8D4, var(--pink));
            border-color: var(--pink-dark);
            color: #fff;
        }

        .app-body {
            display: flex;
            gap: 12px;
            min-height: 80vh;
        }

        .sidebar {
            width: 260px;
            flex-shrink: 0;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 4px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .sidebar-profile {
            background: linear-gradient(to bottom, var(--cream), var(--cream-dark));
            padding: 14px;
            border-bottom: 1px solid var(--border);
            text-align: center;
        }
        .avatar-box {
            width: 70px; height: 70px;
            background: linear-gradient(to bottom, #EAF6FF, #FFF8F0);
            border: 2px solid var(--pink);
            border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            font-size: 36px;
            margin: 0 auto 10px;
            box-shadow: 0 2px 6px rgba(232, 123, 168, 0.2);
        }
        .sidebar-profile input {
            width: 100%;
            text-align: center;
            font-size: 11px;
            padding: 4px 8px;
            border: 1px solid var(--border);
            border-radius: 3px;
            background: rgba(255,255,255,0.8);
            color: var(--text);
            font-family: inherit;
        }

        .sidebar-tabs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1px;
            background: var(--cream-dark);
            padding: 0;
            border-bottom: 1px solid var(--border);
        }
        .sidebar-tab {
            padding: 10px 4px;
            text-align: center;
            font-size: 11px;
            font-weight: bold;
            background: var(--cream);
            color: var(--text-light);
            cursor: pointer;
            transition: all 0.15s;
            border: none;
            font-family: inherit;
            display: flex; flex-direction: column; align-items: center; gap: 4px;
        }
        .sidebar-tab:hover { background: #fff; color: var(--acorn-dark); }
        .sidebar-tab.active {
            background: var(--panel);
            color: var(--acorn-dark);
            box-shadow: inset 0 -2px 0 var(--pink);
        }
        .sidebar-tab i { font-size: 16px; }

        .sidebar-context {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
            background: #fff;
        }

        .sidebar-footer {
            padding: 10px;
            border-top: 1px solid var(--border);
            background: var(--cream);
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .main-content {
            flex: 1;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 4px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            min-width: 0;
        }

        .panel-header {
            background: linear-gradient(to bottom, var(--cream), var(--cream-dark));
            padding: 10px 14px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }
        .panel-title {
            font-size: 13px;
            font-weight: bold;
            color: var(--acorn-dark);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .panel-title i { color: var(--pink-dark); }

        .panel-body { padding: 16px; flex: 1; overflow-y: auto; }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 7px 14px;
            background: linear-gradient(to bottom, #FFFFFF, #F0F0F0);
            border: 1px solid var(--border);
            border-radius: 3px;
            font-size: 11px;
            font-weight: bold;
            color: var(--text);
            cursor: pointer;
            transition: all 0.15s;
            font-family: inherit;
            text-decoration: none;
        }
        .btn:hover {
            background: linear-gradient(to bottom, #FFF8F0, #FFEEDD);
            border-color: var(--pink);
            color: var(--pink-dark);
            transform: translateY(-1px);
        }
        .btn-primary {
            background: linear-gradient(to bottom, #FFB8D4, var(--pink));
            border-color: var(--pink-dark);
            color: #fff;
        }
        .btn-primary:hover {
            background: linear-gradient(to bottom, var(--pink), var(--pink-dark));
            color: #fff;
        }
        .btn-danger { border-color: #E8A0A0; color: #C04040; }
        .btn-danger:hover { background: #FFF0F0; border-color: #C04040; color: #A03030; }

        .rte-toolbar {
            background: #fafcff;
            border-bottom: 1px solid var(--border);
            padding: 6px 10px;
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            align-items: center;
        }
        .rte-toolbar button, .rte-toolbar select {
            background: #fff;
            border: 1px solid var(--border);
            border-radius: 3px;
            padding: 4px 8px;
            font-size: 11px;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.1s;
            color: var(--text);
        }
        .rte-toolbar button:hover, .rte-toolbar select:hover {
            background: var(--cream);
            border-color: var(--pink);
        }
        .rte-toolbar button.active {
            background: var(--acorn-dark);
            color: #fff;
            border-color: var(--acorn-dark);
        }
        .rte-toolbar .divider { width: 1px; height: 20px; background: var(--border); margin: 0 4px; }

        .rte-editor {
            flex: 1;
            padding: 24px 32px;
            font-size: 14px;
            line-height: 1.8;
            overflow-y: auto;
            outline: none;
            color: #1f2937;
            background: #fff;
            min-height: 0;
        }
        .rte-editor:empty:before {
            content: attr(data-placeholder);
            color: #9ca3af;
            font-style: italic;
        }
        .rte-editor h1 { font-size: 1.8em; font-weight: bold; margin: 0.6em 0 0.3em; color: var(--acorn-dark); }
        .rte-editor h2 { font-size: 1.4em; font-weight: bold; margin: 0.5em 0 0.2em; color: var(--acorn-dark); }
        .rte-editor h3 { font-size: 1.2em; font-weight: bold; margin: 0.4em 0 0.2em; color: var(--acorn-dark); }
        .rte-editor p { margin: 0.4em 0; }
        .rte-editor ul, .rte-editor ol { margin: 0.5em 0; padding-left: 1.5em; }
        .rte-editor ul { list-style: disc; }
        .rte-editor ol { list-style: decimal; }
        .rte-editor blockquote {
            border-left: 4px solid var(--pink);
            background: #fff7ed;
            padding: 10px 14px;
            margin: 0.6em 0;
            border-radius: 4px;
            color: #7c2d12;
        }
        .rte-editor blockquote.callout {
            border-left-color: #f59e0b;
            background: #fffbeb;
            color: #78350f;
        }
        .rte-editor pre {
            background: #1e293b;
            color: #e2e8f0;
            padding: 12px 16px;
            border-radius: 6px;
            font-family: 'Share Tech Mono', monospace;
            font-size: 12px;
            overflow-x: auto;
            margin: 0.6em 0;
            white-space: pre-wrap;
        }
        .rte-editor code {
            background: #f1f5f9;
            padding: 2px 6px;
            border-radius: 3px;
            font-family: 'Share Tech Mono', monospace;
            font-size: 0.9em;
            color: var(--pink-dark);
        }
        .rte-editor a { color: var(--link); text-decoration: underline; cursor: pointer; }
        .rte-editor img { max-width: 100%; height: auto; border-radius: 6px; border: 1px solid var(--border); margin: 0.6em 0; display: block; }
        .rte-editor table { border-collapse: collapse; width: 100%; margin: 0.8em 0; font-size: 13px; }
        .rte-editor table th, .rte-editor table td { border: 1px solid #cbd5e1; padding: 8px 10px; text-align: left; }
        .rte-editor table th { background: #e0edf8; font-weight: bold; color: var(--acorn-dark); }
        .rte-editor table tr:nth-child(even) td { background: #f8fafc; }
        .rte-editor audio { width: 100%; margin: 0.6em 0; border-radius: 30px; }

        .rte-editor .audio-block {
            background: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 100%);
            border: 1px solid #7dd3fc;
            border-radius: 10px;
            padding: 10px 14px;
            margin: 0.6em 0;
            box-shadow: 0 1px 3px rgba(2, 132, 199, 0.08);
        }
        .rte-editor .audio-block .audio-label {
            font-size: 11px;
            color: #0369a1;
            font-weight: bold;
            margin-bottom: 0.4em;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .task-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 14px;
            background: #fff;
            border: 1px solid var(--border);
            border-radius: 6px;
            margin-bottom: 8px;
            transition: all 0.15s;
        }
        .task-item:hover { border-color: var(--pink); background: var(--cream); }
        .task-item.completed { opacity: 0.55; }
        .task-item.completed .task-title { text-decoration: line-through; color: var(--text-light); }
        .task-checkbox {
            width: 18px; height: 18px;
            accent-color: var(--pink-dark);
            cursor: pointer;
            flex-shrink: 0;
        }
        .task-content { flex: 1; min-width: 0; }
        .task-title { font-size: 13px; font-weight: bold; color: var(--acorn-dark); }
        .task-meta { display: flex; gap: 8px; margin-top: 4px; font-size: 10px; flex-wrap: wrap; }
        .task-tag {
            padding: 2px 8px;
            border-radius: 999px;
            border: 1px solid var(--border);
            background: var(--cream);
        }
        .task-priority-high { color: #C04040; border-color: #E8A0A0; background: #FFF0F0; }
        .task-priority-medium { color: #B8860B; border-color: #E8D0A0; background: #FFFBF0; }
        .task-priority-low { color: #4A8A4A; border-color: #A0D0A0; background: #F0FFF0; }
        .task-actions { display: flex; gap: 4px; }

        .cal-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 3px;
            background: var(--border);
            padding: 3px;
            border-radius: 6px;
        }
        .cal-header {
            background: var(--cream-dark);
            padding: 8px 4px;
            text-align: center;
            font-size: 11px;
            font-weight: bold;
            color: var(--acorn-dark);
            border-radius: 4px;
        }
        .cal-cell {
            background: #fff;
            min-height: 70px;
            padding: 6px;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.15s;
            position: relative;
            font-size: 11px;
        }
        .cal-cell:hover { background: var(--cream); }
        .cal-cell.empty { background: #fafafa; cursor: default; }
        .cal-cell.today { box-shadow: inset 0 0 0 2px var(--pink); background: #FFF8F0; }
        .cal-cell .cal-day-num { font-weight: bold; color: var(--acorn-dark); }
        .cal-cell .cal-event {
            font-size: 9px;
            color: var(--text-light);
            margin-top: 2px;
            overflow: hidden;
            text-overflow: ellipsis;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            line-height: 1.3;
        }
        .cal-cell .cal-dot {
            width: 5px; height: 5px;
            background: var(--pink-dark);
            border-radius: 50%;
            position: absolute;
            top: 6px; right: 6px;
        }

        .pomo-container {
            max-width: 440px;
            margin: 40px auto;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 32px;
            text-align: center;
            box-shadow: 0 4px 16px rgba(0,0,0,0.06);
        }
        .pomo-modes { display: flex; justify-content: center; gap: 6px; margin-bottom: 24px; flex-wrap: wrap; }
        .pomo-mode-btn {
            padding: 6px 14px;
            border: 1px solid var(--border);
            background: #fff;
            border-radius: 999px;
            font-size: 11px;
            font-weight: bold;
            color: var(--text-light);
            cursor: pointer;
            transition: all 0.15s;
            font-family: inherit;
        }
        .pomo-mode-btn.active { background: var(--acorn-dark); color: #fff; border-color: var(--acorn-dark); }
        .pomo-clock {
            font-family: 'Share Tech Mono', monospace;
            font-size: 72px;
            color: var(--acorn-dark);
            letter-spacing: 2px;
            margin: 20px 0;
            text-shadow: 0 2px 0 var(--cream-dark);
        }
        .pomo-controls { display: flex; justify-content: center; gap: 10px; }
        .pomo-btn {
            padding: 10px 24px;
            font-size: 13px;
            font-weight: bold;
            border-radius: 6px;
            border: 1px solid;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.15s;
        }
        .pomo-btn.start { background: linear-gradient(to bottom, #7FD8A5, #4CAF50); color: #fff; border-color: #3E8E41; }
        .pomo-btn.start:hover { background: linear-gradient(to bottom, #4CAF50, #3E8E41); }
        .pomo-btn.pause { background: linear-gradient(to bottom, #FFD87F, #FFB84D); color: #fff; border-color: #E8A030; }
        .pomo-btn.reset { background: linear-gradient(to bottom, #fff, #f0f0f0); color: var(--text); border-color: var(--border); }
        .pomo-status {
            margin-top: 20px;
            font-size: 12px;
            color: var(--text-light);
            font-style: italic;
        }
        .pomo-completed {
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid var(--border);
            font-size: 12px;
            color: var(--acorn-dark);
            font-weight: bold;
        }

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.45);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 20px;
        }
        .modal-overlay.hidden { display: none; }
        .modal-box {
            background: var(--panel);
            border: 2px solid var(--border-dark);
            border-radius: 6px;
            width: 100%;
            max-width: 480px;
            max-height: 90vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
            overflow: hidden;
        }
        .modal-header {
            background: linear-gradient(to bottom, var(--cream), var(--cream-dark));
            padding: 10px 16px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            font-weight: bold;
            color: var(--acorn-dark);
        }
        .modal-close {
            background: none;
            border: none;
            font-size: 14px;
            cursor: pointer;
            color: var(--text-light);
            padding: 2px 6px;
        }
        .modal-close:hover { color: var(--pink-dark); }
        .modal-body { padding: 20px; overflow-y: auto; }
        .modal-footer {
            padding: 12px 16px;
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            background: #fafafa;
        }

        .form-group { margin-bottom: 14px; }
        .form-group label {
            display: block;
            font-size: 11px;
            font-weight: bold;
            color: var(--acorn-dark);
            margin-bottom: 5px;
        }
        .form-input, .form-select, .form-textarea {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid var(--border);
            border-radius: 3px;
            font-size: 12px;
            font-family: inherit;
            background: var(--cream);
            color: var(--text);
            outline: none;
        }
        .form-input:focus, .form-select:focus, .form-textarea:focus {
            border-color: var(--pink);
            background: #fff;
        }
        .form-textarea { resize: vertical; min-height: 80px; }

        .toast {
            position: fixed;
            bottom: 24px; right: 24px;
            background: var(--acorn-dark);
            color: #fff;
            padding: 10px 18px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: bold;
            box-shadow: 0 4px 16px rgba(0,0,0,0.25);
            z-index: 2000;
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.3s;
            pointer-events: none;
        }
        .toast.show { opacity: 1; transform: translateY(0); }

        @media (max-width: 768px) {
            .app-body { flex-direction: column; }
            .sidebar { width: 100%; }
            .sidebar-tabs { grid-template-columns: 1fr 1fr; }
            .pomo-clock { font-size: 56px; }
            .cal-cell { min-height: 50px; }
        }

        .hidden { display: none !important; }
        .flex { display: flex; }
        .text-center { text-align: center; }
        .mt-2 { margin-top: 8px; }
        .mb-2 { margin-bottom: 8px; }
        .w-full { width: 100%; }
        .gap-2 { gap: 8px; }
    </style>
</head>
<body>

<!-- WELCOME / LOGIN SCREEN -->
<div id="welcome-screen">
    <div class="welcome-box">
        <div class="welcome-logo">
            <span class="acorn">🌰</span>
            <h1>마이데스크</h1>
            <p class="welcome-sub">MyDesk</p>
        </div>
        <p class="welcome-tagline">도토리숲의 조용한 책상.</p>

        <div class="welcome-form">
            <label for="dotori-id-input">도토리 ID</label>
            <input type="text" id="dotori-id-input" maxlength="20"
                   placeholder="dotori-xxxx" autocomplete="off">
            <button id="login-btn">🌰 들어가기</button>
        </div>

        <div class="welcome-load">
            <span>아직 도토리가 없나요?</span>
            <a href="https://jimjimmabi.github.io/-/" class="link-btn">도토리숲에서 만들기 →</a>
        </div>

        <p class="welcome-dedication">
            도토리숲에서 만든 계정으로 그대로 사용할 수 있어요.
        </p>
    </div>
</div>

<!-- MAIN APP -->
<div class="container" id="main-container" style="display:none;">

    <header class="app-header">
        <div class="brand">
            <i class="fa-solid fa-desktop"></i>
            마이데스크
        </div>
        <div class="header-right">
            <span class="status-chip" id="syncStatus"><i class="fa-solid fa-wifi" style="color:#999;"></i> 오프라인 모드</span>
            <button class="lang-btn" onclick="logoutMyDesk()" title="로그아웃" style="margin-left: 6px;">⏻</button>
            <div class="lang-selector">
                <button class="lang-btn active" data-lang="en" onclick="setLanguage('en')">EN</button>
                <button class="lang-btn" data-lang="ko" onclick="setLanguage('ko')">한</button>
                <button class="lang-btn" data-lang="ja" onclick="setLanguage('ja')">日</button>
                <button class="lang-btn" data-lang="zh" onclick="setLanguage('zh')">中</button>
            </div>
        </div>
    </header>

    <div class="app-body">

        <aside class="sidebar">
            <div class="sidebar-profile">
                <div class="avatar-box">👩‍💻</div>
                <input type="text" id="userMood" placeholder="What's your mood?" onchange="saveMood(this.value)">
            </div>

            <nav class="sidebar-tabs">
                <button class="sidebar-tab active" data-tab="documents" onclick="switchTab('documents')">
                    <i class="fa-solid fa-file-lines"></i>
                    <span>Docs</span>
                </button>
                <button class="sidebar-tab" data-tab="todo" onclick="switchTab('todo')">
                    <i class="fa-solid fa-list-check"></i>
                    <span>Tasks</span>
                </button>
                <button class="sidebar-tab" data-tab="calendar" onclick="switchTab('calendar')">
                    <i class="fa-solid fa-calendar-days"></i>
                    <span>Calendar</span>
                </button>
                <button class="sidebar-tab" data-tab="pomodoro" onclick="switchTab('pomodoro')">
                    <i class="fa-solid fa-clock"></i>
                    <span>Focus</span>
                </button>
            </nav>

            <div class="sidebar-context" id="sidebarContext"></div>

            <div class="sidebar-footer">
                <button class="btn w-full" onclick="exportAllWorkspaceJSON()">
                    <i class="fa-solid fa-download"></i> Backup
                </button>
                <label class="btn w-full" style="cursor:pointer;">
                    <i class="fa-solid fa-upload"></i> Restore
                    <input type="file" id="importFile" accept=".json" onchange="importWorkspaceJSON(event)" class="hidden">
                </label>
                <button class="btn w-full btn-danger" onclick="resetWorkspace()">
                    <i class="fa-solid fa-trash"></i> Reset All
                </button>
            </div>
        </aside>

        <main class="main-content" id="mainContent">

            <div id="view-documents" class="workspace-view" style="display:flex;flex-direction:column;flex:1;min-height:0;">
                <div class="panel-header">
                    <input type="text" id="activeDocTitle" placeholder="Page Title..." oninput="updateActiveTitle(this.value)"
                           style="flex:1;min-width:200px;font-size:16px;font-weight:bold;color:var(--acorn-dark);background:transparent;border:none;border-bottom:1px solid transparent;padding:4px 0;font-family:inherit;outline:none;"
                           onfocus="this.style.borderBottomColor='var(--pink)'" onblur="this.style.borderBottomColor='transparent'">
                    <div style="display:flex;gap:6px;">
                        <button class="btn" onclick="exportDocTxt()"><i class="fa-solid fa-file-lines"></i> .txt</button>
                        <button class="btn" onclick="exportDocHtml()"><i class="fa-solid fa-code"></i> .html</button>
                        <button class="btn" onclick="exportDocJson()"><i class="fa-solid fa-database"></i> .json</button>
                        <button class="btn btn-danger" onclick="deleteActiveDocument()"><i class="fa-solid fa-trash"></i></button>
                    </div>
                </div>

                <div class="rte-toolbar">
                    <select onchange="rteExec('formatBlock', this.value); this.selectedIndex=0;">
                        <option value="">Paragraph</option>
                        <option value="h1">Heading 1</option>
                        <option value="h2">Heading 2</option>
                        <option value="h3">Heading 3</option>
                        <option value="p">Paragraph</option>
                        <option value="pre">Code Block</option>
                        <option value="blockquote">Quote</option>
                    </select>
                    <span class="divider"></span>
                    <button onclick="rteExec('bold')" title="Bold"><i class="fa-solid fa-bold"></i></button>
                    <button onclick="rteExec('italic')" title="Italic"><i class="fa-solid fa-italic"></i></button>
                    <button onclick="rteExec('underline')" title="Underline"><i class="fa-solid fa-underline"></i></button>
                    <button onclick="rteExec('strikeThrough')" title="Strikethrough"><i class="fa-solid fa-strikethrough"></i></button>
                    <span class="divider"></span>
                    <button onclick="rteExec('insertUnorderedList')" title="Bullet list"><i class="fa-solid fa-list-ul"></i></button>
                    <button onclick="rteExec('insertOrderedList')" title="Numbered list"><i class="fa-solid fa-list-ol"></i></button>
                    <button onclick="rteInsertCallout()" title="Callout"><i class="fa-solid fa-lightbulb" style="color:#f59e0b;"></i></button>
                    <span class="divider"></span>
                    <button onclick="rteInsertLink()" title="Insert link"><i class="fa-solid fa-link" style="color:var(--link);"></i></button>
                    <button onclick="document.getElementById('rteImageInput').click()" title="Insert image"><i class="fa-solid fa-image" style="color:#4CAF50;"></i></button>
                    <button onclick="rteInsertTable()" title="Insert table"><i class="fa-solid fa-table" style="color:#9C27B0;"></i></button>
                    <button onclick="rteExec('undo')" title="Undo"><i class="fa-solid fa-rotate-left"></i></button>
                    <button onclick="rteExec('redo')" title="Redo"><i class="fa-solid fa-rotate-right"></i></button>
                    <button onclick="rteExec('removeFormat')" title="Clear format"><i class="fa-solid fa-eraser"></i></button>

                    <input type="file" id="rteImageInput" accept="image/*" class="hidden" onchange="handleRteImage(event)">
                </div>

                <div id="rteEditor" class="rte-editor" contenteditable="true" data-placeholder="Start writing your notes..."></div>
            </div>

            <div id="view-todo" class="workspace-view" style="display:none;flex-direction:column;flex:1;min-height:0;">
                <div class="panel-header">
                    <div class="panel-title"><i class="fa-solid fa-list-check"></i> Tasks</div>
                    <button class="btn btn-primary" onclick="openTaskModal()"><i class="fa-solid fa-plus"></i> Add Task</button>
                </div>
                <div class="panel-body" id="taskList"></div>
            </div>

            <div id="view-calendar" class="workspace-view" style="display:none;flex-direction:column;flex:1;min-height:0;">
                <div class="panel-header">
                    <div class="panel-title"><i class="fa-solid fa-calendar-days"></i> Calendar</div>
                    <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap;">
                        <button class="btn" onclick="changeMonth(-1)"><i class="fa-solid fa-chevron-left"></i></button>
                        <span id="calMonthTitle" style="font-weight:bold;font-size:13px;color:var(--acorn-dark);min-width:130px;text-align:center;">-</span>
                        <button class="btn" onclick="changeMonth(1)"><i class="fa-solid fa-chevron-right"></i></button>
                    </div>
                </div>
                <div class="panel-body" style="display:flex;flex-direction:column;gap:12px;">
                    <div class="cal-grid" id="calGrid"></div>
                </div>
            </div>

            <div id="view-pomodoro" class="workspace-view" style="display:none;flex-direction:column;flex:1;min-height:0;">
                <div class="panel-header">
                    <div class="panel-title"><i class="fa-solid fa-clock"></i> Focus Timer</div>
                </div>
                <div class="panel-body">
                    <div class="pomo-container">
                        <div class="pomo-modes">
                            <button class="pomo-mode-btn active" data-mode="work" onclick="setPomoMode('work')">Focus (25m)</button>
                            <button class="pomo-mode-btn" data-mode="shortBreak" onclick="setPomoMode('shortBreak')">Short Break (5m)</button>
                            <button class="pomo-mode-btn" data-mode="longBreak" onclick="setPomoMode('longBreak')">Long Break (15m)</button>
                        </div>
                        <div class="pomo-clock" id="pomoClock">25:00</div>
                        <div class="pomo-controls">
                            <button class="pomo-btn start" id="pomoStart" onclick="startPomodoro()"><i class="fa-solid fa-play"></i> Start</button>
                            <button class="pomo-btn pause hidden" id="pomoPause" onclick="pausePomodoro()"><i class="fa-solid fa-pause"></i> Pause</button>
                            <button class="pomo-btn reset" onclick="resetPomodoro()"><i class="fa-solid fa-rotate-right"></i> Reset</button>
                        </div>
                        <div class="pomo-status" id="pomoStatus">Ready to focus</div>
                        <div class="pomo-completed">Completed today: <span id="pomoCount">0</span> 🍅</div>
                    </div>
                </div>
            </div>

        </main>
    </div>
</div>

<div id="taskModal" class="modal-overlay hidden">
    <div class="modal-box">
        <div class="modal-header">
            <span id="taskModalTitle">Add Task</span>
            <button class="modal-close" onclick="closeTaskModal()">✕</button>
        </div>
        <div class="modal-body">
            <input type="hidden" id="taskId">
            <div class="form-group">
                <label>Task Title</label>
                <input type="text" id="taskTitle" class="form-input" placeholder="What needs to be done?">
            </div>
            <div class="form-group">
                <label>Priority</label>
                <select id="taskPriority" class="form-select">
                    <option value="High">🔴 High</option>
                    <option value="Medium" selected>🟡 Medium</option>
                    <option value="Low">🟢 Low</option>
                </select>
            </div>
            <div class="form-group">
                <label>Category</label>
                <input type="text" id="taskCategory" class="form-input" value="General">
            </div>
            <div class="form-group">
                <label>Due Date / Notes</label>
                <input type="text" id="taskDue" class="form-input" placeholder="e.g. Tomorrow">
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn" onclick="closeTaskModal()">Cancel</button>
            <button class="btn btn-primary" onclick="saveTask()">Save Task</button>
        </div>
    </div>
</div>

<div id="calModal" class="modal-overlay hidden">
    <div class="modal-box">
        <div class="modal-header">
            <span id="calModalTitle">Event</span>
            <button class="modal-close" onclick="closeCalModal()">✕</button>
        </div>
        <div class="modal-body">
            <input type="hidden" id="calDateKey">
            <div class="form-group">
                <label>Note / Event</label>
                <textarea id="calText" class="form-textarea" placeholder="Write your thoughts or plans..."></textarea>
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn" onclick="closeCalModal()">Cancel</button>
            <button class="btn btn-primary" onclick="saveCalEvent()">Save</button>
        </div>
    </div>
</div>

<div id="toast" class="toast"></div>

<footer class="site-footer">
    <p class="footer-dev-link" style="font-size: 10px; color: #BBBBBB; margin-top: 8px;">
        제 웹사이트: <a href="https://jimjimmabi.github.io/home/" target="_blank" style="color: #0066CC;">웹사이트로 이동해 주세요.</a>
    </p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/storage/supabase.js"></script>
<script src="js/app.js"></script>
</body>
</html>
